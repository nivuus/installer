# config/agent.yaml

# MQTT Broker Configuration
mqtt:
  host: "192.168.0.1" # Replace with your MQTT broker IP or hostname
  port: 1883
  username: "mqtt" # Optional: username for MQTT broker
  password: "CHANGE_ME_MQTT_PASSWORD" # Optional: password for MQTT broker
  # SECURITY NOTE: For better security, use environment variables instead:
  # Set MQTT_USERNAME and MQTT_PASSWORD environment variables to override these values.
  # Example: export MQTT_USERNAME="mqtt" && export MQTT_PASSWORD="your_password"
  # Environment variables take precedence over config file values.
  base_topic: "system_agent" # Base topic for all entities published by this agent
  # For TLS/SSL connections, uncomment and configure the following:
  # protocol: "mqtts" # or "wss" for WebSocket Secure
  # ca_file: "/path/to/ca.crt"
  # cert_file: "/path/to/client.crt"
  # key_file: "/path/to/client.key"
  # reject_unauthorized: true # Set to false if using self-signed certs and you understand the risk

# Device Information for Home Assistant
# This information will be used to register the agent as a single device in Home Assistant.
# All entities created by this agent will be linked to this device.
device_info:
  identifiers: ["nivuus"] # Unique identifier for this agent device. Replace with a truly unique ID, e.g., MAC address or a UUID.
  name: "Nivuus" # Friendly name of the device in Home Assistant
  manufacturer: "nivuus"
  model: "System Agent v1.0"
  sw_version: "0.1.1" # Agent software version, can be updated from package.json

# WebSocket Server Configuration for Wizard API
# This allows direct communication between Home Assistant and the agent
# without going through MQTT (useful for wizard/setup flows)
websocket:
  enabled: true
  port: 8766
  host: "0.0.0.0"  # Listen on all interfaces (use 127.0.0.1 for localhost only)
  auth:
    type: "token"  # "token" or "none"
    token: "CHANGE_ME_WIZARD_TOKEN"  # Change this in production!
    # Alternatively, use environment variable: ${NIVUUS_WS_TOKEN}

# Windows VM WinRM connection for GPU monitoring and streaming status
windows_vm:
  hostname: "192.168.3.2"
  port: 5985
  username: "Administrateur"
  password: "CHANGE_ME_PASSWORD"

# Feature Configuration
# Enable/disable and configure individual features here.
# Each feature section can have an 'enabled' flag and an 'update_interval_seconds' setting.
# Feature-specific configurations can also be added.
features:
  cpu_temperature:
    enabled: true
    update_interval_seconds: 60
  cpu_load:
    enabled: true
    update_interval_seconds: 60
  memory_usage:
    enabled: true
    update_interval_seconds: 60
  network_stats:
    enabled: true
    update_interval_seconds: 60
    # interfaces: ["eth0", "wlan0"] # Optional: specify interfaces, otherwise auto-detects relevant ones
  disk_usage:
    enabled: true
    update_interval_seconds: 60
    drives: ["/", "/boot", "/boot/efi", "/media/backup", "/media/data", "/media/vm"] # Explicit drive list
  apt_updates:
    enabled: true
    check_interval_hours: 12 # How often to check for APT updates
  docker_updates:
    enabled: true
    check_interval_hours: 12 # How often to check for Docker image updates
    exclude_containers: [] # Optional: exclude specific containers by service name
  firewalld_manager:
    enabled: true
    update_interval_seconds: 600 # Check active zones every 10 minutes
  hostapd_manager:
    enabled: true
    update_interval_seconds: 7200 # Check hostapd config every 2 hours
    config_paths: 
      - "/etc/hostapd/2.4Ghz.conf"
      - "/etc/hostapd/5Ghz.conf"
  vm_manager:
    enabled: true
    update_interval_seconds: 600 # Check VM states every 10 minutes
    # vm_names: ["vm-ubuntu", "vm-arch"] # Optional: specify VMs to monitor by name, otherwise all are monitored
  connected_devices:
    enabled: true
    update_interval_seconds: 300 # Check connected devices every 5 minutes
    # bridge_interfaces: ["br-lan", "br-public"] # Optional: specify bridge interfaces, otherwise auto-detect
  pppoe_credentials:
    enabled: true # Set to false if not using PPPoE or if paths are different
    update_interval_seconds: 21600 # Check every 6 hours
    # chap_secrets_path: "/etc/ppp/chap-secrets"
    # pap_secrets_path: "/etc/ppp/pap-secrets"
  smart_status:
    enabled: true
    update_interval_seconds: 7200 # Check SMART status every 2 hours
    # disks_to_monitor: ["sda", "sdb", "nvme0n1"] # Optional: specify disks like sda, sdb. Auto-detects if empty.
    # Remote disks (Windows VM via WinRM)
    remote_disks:
      - name: "windows_vm_sda"
        device: "/dev/sda"
        friendly_name: "Windows C:"
  event_monitor:
    enabled: true
    update_interval_seconds: 300 # How often the event history is refreshed (real-time streaming is separate)
    fail2ban_log: "/var/log/fail2ban.log"
    auth_log: "/var/log/auth.log" # or /var/log/secure for other distros
    syslog_watch_level: ["error", "critical"] # Syslog levels to monitor from /var/log/syslog
  gpu_monitoring:
    enabled: true
    update_interval_seconds: 60 # GPU metrics update every 60 seconds (aligned with CPU/Memory/Network)
  motherboard_temperature:
    enabled: true
    update_interval_seconds: 30 # Motherboard sensors every 30 seconds
  hardware_health:
    enabled: true
    # Power rails + CPU/memory/disk error counters. Added 2026-08-16 after four
    # instant platform halts left no trace at all. Rails and CPU counters are
    # cheap sysfs reads; the disk counters fork smartctl and refresh internally
    # every 10 min regardless of this interval.
    update_interval_seconds: 30
  systemd_services:
    enabled: true
    update_interval_seconds: 60 # Check services every minute
  streaming_status:
    enabled: true
    update_interval_seconds: 120 # Check streaming status every 2 minutes (aligned with connected_devices)
  kvm_split_lock_monitor:
    enabled: true
    update_interval_seconds: 60 # Check split lock status every minute
  windows_disk_usage:
    enabled: true
    update_interval_seconds: 60 # Check Windows disk usage every minute
    volumes: ["C:"] # Optional: specify volumes to monitor, auto-detects all fixed drives if empty
  ups_monitor:
    enabled: true
    update_interval_seconds: 15
    ups_name: "myups@localhost"
    low_battery_threshold: 30
    critical_battery_threshold: 10
    shutdown_on_critical: true
    shutdown_script: "/opt/mqtt-system-agent/scripts/ups-shutdown.sh"

# Logging Configuration
logging:
  level: "info" # "debug", "info", "warn", "error"
