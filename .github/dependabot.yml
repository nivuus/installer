version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore"
  # The live image's venv pins (kept equal to the root ones by a test).
  - package-ecosystem: pip
    directory: "/installer/webapp"
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore"
