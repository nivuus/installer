name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  policy:
    uses: nivuus/.github/.github/workflows/policy.yml@main
  security:
    uses: nivuus/.github/.github/workflows/security.yml@main
  python:
    uses: nivuus/.github/.github/workflows/ci-python.yml@main
    with:
      # No pytest suite: the files under scripts/tests/ are standalone scripts
      # that run on import, not pytest modules. Aiming pytest at them executes
      # them during collection. Tracked as an issue in this repository.
      test-paths: ""
  shell:
    uses: nivuus/.github/.github/workflows/ci-shell.yml@main
    with:
      test-dirs: ""
      shellcheck-paths: "."
  codeql:
    uses: nivuus/.github/.github/workflows/codeql.yml@main
    with:
      # Python only: CodeQL supports neither Bash nor Zsh, so the shell
      # scripts here are covered by shellcheck instead.
      languages: python
