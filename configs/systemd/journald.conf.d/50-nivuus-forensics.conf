# Keep enough journal to investigate a hard freeze after the fact.
# Deployed to /etc/systemd/journald.conf.d/; overrides /etc/systemd/journald.conf.
#
# 2026-10-23: three platform freezes on 21-23/10 were investigated with only two
# days of journal left (MaxRetentionSec=2day), so the hostapd station events and
# the earlier boots of the 06/10 series were already gone, and only rsyslog's
# files reached back further.
[Journal]
# A month covers the gap between incident series seen so far (06/10 -> 21/10).
# Measured 23/10: ~90 MB per day at MaxLevelKMsg=warning; the cap leaves room
# for info-level kernel messages and still keeps 190 GB free on /.
MaxRetentionSec=30day
SystemMaxUse=6G
# The kernel's info level carries the driver chatter that dates an unstable
# period (ath10k tx_fetch_ind, link resets); warning dropped part of it.
MaxLevelKMsg=info
# journald fsyncs at once only for CRIT/ALERT/EMERG. Everything else, including
# a service's stderr (stored at priority 6, measured), waits this long in
# memory, and a freeze loses all of it. The default 5 min is the window the
# investigation needs most; 5 s bounds the loss at the cost of one fsync per
# 5 s of activity on the NVMe.
SyncIntervalSec=5s
