# Forward Secure Sealing: journald seals the journal every 15 min with a key
# that evolves forward, so an intruder who gets root later cannot rewrite
# what was logged before without "journalctl --verify" noticing.
# The sealing key lives in /var/log/journal/<machine-id>/fss (journalctl
# --setup-keys); the verification key is kept OFF this host by the owner.
[Journal]
Seal=yes
