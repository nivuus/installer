# Minimal hand-written hardening (2026-11-09). auditd forks, starts its plugins
# and may run space/disk actions, and the SHH-generated profile broke it
# ("Cannot daemonize", 2026-11-08), so only options that do not touch files,
# capabilities, address families or the fork path are set here.
[Service]
ProtectClock=yes
ProtectHostname=yes
ProtectKernelLogs=yes
RestrictNamespaces=yes
RestrictSUIDSGID=yes
SystemCallArchitectures=native
