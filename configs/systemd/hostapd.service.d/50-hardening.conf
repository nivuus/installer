# Hand-written hardening (2026-11-09). Deliberately absent:
# - PrivateTmp: hostapd replies to control clients (hostapd_cli, the mqtt agent)
#   on the socket they bind in THEIR /tmp; a private /tmp makes every reply fail.
# - ProtectKernelTunables: hostapd and the ExecStartPost lines write /proc/sys
#   and /sys (bridge port flags, txpower).
# - PrivateDevices: hostapd watches /dev/rfkill.
# - Capability limits: it needs CAP_NET_ADMIN and CAP_NET_RAW.
[Service]
NoNewPrivileges=yes
ProtectSystem=full
ProtectHome=yes
ProtectKernelModules=yes
ProtectKernelLogs=yes
ProtectControlGroups=yes
ProtectClock=yes
ProtectHostname=yes
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6 AF_NETLINK AF_PACKET
RestrictNamespaces=yes
RestrictRealtime=yes
RestrictSUIDSGID=yes
LockPersonality=yes
MemoryDenyWriteExecute=yes
SystemCallArchitectures=native
