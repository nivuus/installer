# Hand-written hardening (2026-11-09), replaces the old harden.conf
# (PrivateTmp + NoNewPrivileges + ReadWritePaths that changed nothing).
# Deliberately absent:
# - ProtectHome: the [projects] share is /home/mallanic/Projects.
# - ProtectSystem=full/strict: ExecStartPre rewrites the AppArmor share list
#   under /etc/apparmor.d, and "unix password sync" runs passwd (/etc/shadow).
# - A capability allow-list: smbd switches to the user (SETUID/SETGID), takes
#   kernel leases (LEASE), overrides DAC and changes ownership; only the
#   capabilities it never uses are dropped below.
[Service]
PrivateTmp=yes
NoNewPrivileges=yes
ProtectSystem=yes
PrivateDevices=yes
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectKernelLogs=yes
ProtectControlGroups=yes
ProtectClock=yes
ProtectHostname=yes
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6 AF_NETLINK
RestrictNamespaces=yes
RestrictRealtime=yes
RestrictSUIDSGID=yes
LockPersonality=yes
MemoryDenyWriteExecute=yes
SystemCallArchitectures=native
CapabilityBoundingSet=~CAP_SYS_MODULE CAP_SYS_BOOT CAP_SYS_TIME CAP_SYS_PTRACE CAP_SYS_RAWIO CAP_MKNOD CAP_NET_ADMIN CAP_NET_RAW CAP_SYS_PACCT CAP_BPF CAP_PERFMON CAP_SYSLOG CAP_AUDIT_CONTROL CAP_AUDIT_READ CAP_WAKE_ALARM CAP_BLOCK_SUSPEND CAP_MAC_ADMIN CAP_MAC_OVERRIDE CAP_SYS_TTY_CONFIG CAP_LINUX_IMMUTABLE CAP_IPC_OWNER CAP_SETPCAP CAP_SETFCAP CAP_NET_BROADCAST CAP_CHECKPOINT_RESTORE
