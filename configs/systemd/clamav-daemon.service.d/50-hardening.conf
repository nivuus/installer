# Hand-written (2026-11-09): SHH cannot profile clamd, which is socket-activated
# (the wrapper receives LISTEN_FDS, clamd then tries to bind its own socket).
# Only options that cannot touch scanning: clamd reads files passed by fd or by
# path anywhere (no ProtectHome/PrivateTmp), and its
# databases are written by freshclam, not by clamd.
[Service]
NoNewPrivileges=yes
PrivateDevices=yes
ProtectSystem=full
ProtectClock=yes
ProtectHostname=yes
ProtectKernelLogs=yes
ProtectKernelModules=yes
ProtectKernelTunables=yes
ProtectControlGroups=yes
RestrictNamespaces=yes
RestrictRealtime=yes
RestrictSUIDSGID=yes
LockPersonality=yes
SystemCallArchitectures=native
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6
