# Hand-written (2026-11-09): SHH cannot profile clamonacc, fanotify breaks under
# strace ("ClamFanotif: internal error ... Bad file descriptor"). clamonacc needs
# CAP_SYS_ADMIN for fanotify and moves detections from /media/data to
# /root/quarantine, so no ProtectHome and no capability restriction.
[Service]
NoNewPrivileges=yes
PrivateDevices=yes
ProtectSystem=full
ProtectClock=yes
ProtectHostname=yes
ProtectKernelLogs=yes
ProtectKernelModules=yes
ProtectKernelTunables=yes
ProtectControlGroups=yes
RestrictNamespaces=yes
RestrictRealtime=yes
RestrictSUIDSGID=yes
LockPersonality=yes
SystemCallArchitectures=native
RestrictAddressFamilies=AF_UNIX AF_NETLINK
