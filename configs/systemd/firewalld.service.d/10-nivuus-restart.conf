# The packaged unit has no Restart=: a firewalld that dies stays dead. On
# 2026-10-11 a mass SIGKILL took it down with 50 other services; everything
# carrying Restart= came back within seconds, firewalld stayed down for ten
# minutes. Its nftables table survives the daemon, so filtering and NAT held,
# but nothing could assign a zone any more: the tethering interface that came
# up in that window had none, and every firewall-cmd caller failed.
#
# on-failure and not always: a deliberate stop must stay a stop.
#
# Known cost: a restarted firewalld rebuilds its table from the permanent
# configuration, so runtime-only rules are lost -- here the cloud-gaming
# forward-ports the libvirt hooks add at VM start.
[Service]
Restart=on-failure
RestartSec=2
