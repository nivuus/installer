# Appended to /etc/default/irqbalance. Original kept as
# /etc/default/irqbalance.avant-ban-pcores.
#
# Nivuus: keep every IRQ off the P-cores.
# The Windows VM pins cpu0-15 while it runs (scripts/vm-cpu-partition.sh) and
# irqbalance had piled 98 IRQ onto cpu0 alone -- ahci, xhci, the enp5s0 queues,
# the nvme admin queue. Each of those fired straight into a running vCPU.
# Kernel-managed IRQ (nvme io queues) are not affected: irqbalance cannot move
# them, and the kernel already spreads them.
IRQBALANCE_BANNED_CPULIST=0-15
