- key: dedicated_nvme
  type: disque
  label: "NVMe dédié à la console (il sera donné entièrement à la VM)"
  required: true

# Le mode disque est POSÉ, jamais deviné, et sans valeur par défaut.
#
# guest_steps.refuse_implicit_wipe() refuse un effacement que personne n'a
# demandé, et renvoie vers « --disk-mode rebuild --target-disk-verified ».
# Tant que ces deux questions n'existaient pas, ce remède n'était atteignable
# qu'en éditant le fichier de réponses à la main : un garde qui refuse en
# nommant une sortie inaccessible n'enseigne qu'à le contourner.
#
# PAS DE DÉFAUT, délibérément. Un défaut n'est pas une phrase : « wipe » par
# défaut rendrait la réponse explicite au sens de _disk_mode(), et ferait
# donc taire le garde pour tout le monde — le défaut dirait, à la place de
# l'opérateur, exactement ce que le garde exige qu'il dise lui-même.
- key: disk_mode
  type: choix
  label: >-
    Disposition du disque de la console. « wipe » recrée la table de
    partitions ENTIÈRE : sur une machine où un seul disque porte C: et la
    partition de jeux D:, il détruit aussi D: (bibliothèque Steam, session
    ouverte, sauvegardes d'émulation, racine d'appairage Apollo).
    « rebuild » ne reformate que la partition système et garde D: — mais il
    exige une partition système déjà en place, il ne sait pas installer sur
    un disque vierge.
  choices: ["wipe", "rebuild"]
  required: true

- key: target_disk_verified
  type: bool
  label: >-
    Je confirme avoir vérifié DE QUEL disque il s'agit (requis par
    « rebuild », qui reformate une partition en place)
  default: false

- key: retro
  type: bool
  label: "Installer le retrogaming (RetroArch et émulateurs)"
  default: false

- key: admin_password
  type: secret
  label: "Mot de passe administrateur Windows"
  required: true

- key: windows_iso
  type: texte
  label: "Media Windows 11 IoT Enterprise LTSC : chemin local de l'ISO"
  required: true

- key: ltsc_key
  type: secret
  label: "Clé produit Windows LTSC"
  required: true

- key: apollo_password
  type: secret
  label: "Mot de passe de l'interface Apollo"
  required: true

- key: guest_workdir
  type: texte
  label: "Répertoire de travail pour la construction de l'invité"
  default: "/var/lib/nivuus/guest"
